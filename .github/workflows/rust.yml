name: Rust

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Lint
      run: cargo clippy -- -D warnings
    - name: Format check
      run: cargo fmt --check
    - name: Build
      run: cargo build --release --verbose
    - name: Run tests
      run: cargo test --verbose
